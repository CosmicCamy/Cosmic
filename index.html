<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Cosmic Music Player</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Cosmic Music Player">
    <link rel="apple-touch-icon" href="Cosmic.png">
    <link rel="manifest" href="manifest.json">
    <script src="https://jsdelivr.net"></script>
    <style>
        body { background: #121212; color: white; font-family: sans-serif; text-align: center; padding: 40px 20px 20px 20px; margin: 0; }
        .player-card { background: #1e1e1e; border-radius: 20px; padding: 25px; max-width: 400px; margin: 0 auto; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .btn { background: #ff4500; border: none; padding: 12px 24px; margin: 8px; color: white; border-radius: 25px; font-size: 15px; cursor: pointer; font-weight: bold; }
        .btn-active { background: #00ffcc; color: black; }
        #track-title { font-size: 20px; margin-bottom: 10px; color: #00ffcc; }
        #playlist-select { background: #2a2a2a; color: white; border: 1px solid #444; padding: 10px; border-radius: 10px; width: 100%; margin-top: 15px; font-size: 16px; }
        .upload-section { margin-top: 20px; border-top: 1px solid #333; padding-top: 15px; }
        #file-input { display: none; }
        #upload-status { font-size: 12px; color: #aaa; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="player-card">
        <h1>🌌 Cosmic Music Player</h1>
        <div id="track-title">Loading track...</div>
        <audio id="audio" style="width: 100%; margin-top: 15px;"></audio>
        
        <div>
            <button class="btn" onclick="prevTrack()">⏮️ Prev</button>
            <button class="btn" id="play-pause-btn" onclick="togglePlay()">⏸️ Pause</button>
            <button class="btn" onclick="nextTrack()">⏭️ Next</button>
        </div>
        <div>
            <button class="btn" id="shuf-btn" onclick="toggleShuffle()">🔀 Shuffle</button>
            <button class="btn" id="loop-btn" onclick="toggleLoop()">🔁 Loop: OFF</button>
        </div>
        
        <select id="playlist-select" onchange="playTrackByIndex(parseInt(this.value))"></select>

        <div class="upload-section">
            <label for="file-input" class="btn" style="background: #333; display: inline-block;">👥 Shared Group Upload</label>
            <input type="file" id="file-input" accept="audio/*" multiple onchange="handleCloudUpload(event)">
            <div id="upload-status"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://jelekafnbepkmblpgcyi.supabase.co";
        const SUPABASE_KEY = "sb_publishable_Cn0BdRGQCdjOpbWYRfDOPQ_ivhJmZXj";
        
        // FIX: Removed the double namespace initialization error
        const supabase = supabase.createClient ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let playlist = [];
        let index = 0, isShuffle = false, loopMode = 0;
        const player = document.getElementById('audio');
        const selectBox = document.getElementById('playlist-select');
        const playPauseBtn = document.getElementById('play-pause-btn');
        const statusDiv = document.getElementById('upload-status');

        async function fetchLivePlaylist() {
            try {
                const { data, error } = await supabase.from('playlist').select('*').order('id', { ascending: true });
                if (error) throw error;
                playlist = data || [];
                updateUI();
            } catch (err) {
                console.error("Database connection failed:", err);
                document.getElementById('track-title').innerText = "Database Error";
            }
        }

        function updateUI() {
            const currentVal = selectBox.value;
            selectBox.innerHTML = '';
            playlist.forEach((track, i) => {
                let opt = document.createElement('option');
                opt.value = i;
                opt.innerText = track.title;
                selectBox.appendChild(opt);
            });
            if(playlist.length > 0 && !player.src) { loadTrack(0); }
            if(currentVal && currentVal < playlist.length) selectBox.value = currentVal;
        }

        function loadTrack(i) {
            if (!playlist || playlist.length === 0) {
                document.getElementById('track-title').innerText = "Empty Playlist";
                return;
            }
            index = i;
            selectBox.value = i;
            document.getElementById('track-title').innerText = playlist[index].title;
            player.src = playlist[index].url;
        }

        function playTrackByIndex(i) {
            loadTrack(i);
            player.play().then(() => playPauseBtn.innerText = "⏸️ Pause").catch(e => console.log(e));
        }

        function togglePlay() {
            if (player.paused) { player.play(); playPauseBtn.innerText = "⏸️ Pause"; }
            else { player.pause(); playPauseBtn.innerText = "▶️ Play"; }
        }

        function nextTrack() {
            if (playlist.length === 0) return;
            if (loopMode === 1) { loadTrack(index); player.play(); }
            else if (isShuffle) { playTrackByIndex(Math.floor(Math.random() * playlist.length)); }
            else { playTrackByIndex((index + 1) % playlist.length); }
        }

        function prevTrack() { if (playlist.length > 0) playTrackByIndex((index - 1 + playlist.length) % playlist.length); }
        function toggleShuffle() { isShuffle = !isShuffle; document.getElementById('shuf-btn').classList.toggle('btn-active', isShuffle); }
        function toggleLoop() {
            loopMode = (loopMode + 1) % 3;
            const btn = document.getElementById('loop-btn');
            if (loopMode === 0) { btn.innerText = "🔁 Loop: OFF"; btn.classList.remove('btn-active'); }
            if (loopMode === 1) { btn.innerText = "🔂 Loop: SONG"; btn.classList.add('btn-active'); }
            if (loopMode === 2) { btn.innerText = "🔁 Loop: ALL"; btn.classList.add('btn-active'); }
        }

        // FIX: Converted the accidental Python 'def' into native async JS function syntax
        async function handleCloudUpload(event) {
            const files = event.target.files;
            if (!files || !files.length) return;

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const cleanTitle = file.name.replace(/\.[^/.]+$/, "");
                const fileName = `${Date.now()}_${file.name}`;
                
                statusDiv.innerText = `Uploading: ${cleanTitle}...`;

                try {
                    const { data: uploadData, error: uploadError } = await supabase.storage.from('Songs').upload(fileName, file);
                    if (uploadError) throw uploadError;

                    const { data: linkData } = supabase.storage.from('Songs').getPublicUrl(fileName);
                    const publicUrl = linkData.publicUrl;

                    const { error: dbError } = await supabase.from('playlist').insert([{ title: cleanTitle, url: publicUrl }]);
                    if (dbError) throw dbError;
                } catch (err) {
                    console.error(err);
                    statusDiv.innerText = "Upload failed! Check bucket name case sensitivity.";
                    return;
                }
            }
            statusDiv.innerText = "✨ Success! Added to multiplayer playlist.";
            await fetchLivePlaylist();
        }

        try {
            supabase.channel('schema-db-changes')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'playlist' }, payload => {
                    playlist.push(payload.new);
                    updateUI();
                }).subscribe();
        } catch(e) { console.log("Realtime connection error:", e); }

        player.onended = nextTrack;
        window.onload = fetchLivePlaylist;
    </script>
</body>
</html>
