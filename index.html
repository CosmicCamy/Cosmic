<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"> 
    <title>Cosmic Music Player</title> 
    <meta name="apple-mobile-web-app-capable" content="yes"> 
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"> 
    <meta name="apple-mobile-web-app-title" content="Cosmic Music Player"> 
    <link rel="apple-touch-icon" href="Cosmic.png"> 
    <link rel="manifest" href="manifest.json?v=3"> 
    <script src="https://jsdelivr.net"></script> 
    <style> 
        body { background: #121212; color: white; font-family: sans-serif; text-align: center; padding: 40px 20px 20px 20px; margin: 0; } 
        .player-card { background: #1e1e1e; border-radius: 20px; padding: 25px; max-width: 400px; margin: 0 auto; box-shadow: 0 4px 15px rgba(0,0,0,0.5); } 
        .btn { background: #00ff66; border: none; padding: 12px 24px; margin: 8px; color: black; border-radius: 25px; font-size: 15px; cursor: pointer; font-weight: bold; box-shadow: 0 2px 10px rgba(0,255,102,0.2); } 
        .btn-active { background: #00ffcc; color: black; } 
        #track-title { font-size: 20px; margin-bottom: 10px; color: #00ffcc; } 
        #playlist-select { background: #2a2a2a; color: #0066ff; border: 1px solid #444; padding: 10px; border-radius: 10px; width: 100%; margin-top: 15px; font-size: 16px; font-weight: bold; } 
        .upload-section { margin-top: 20px; border-top: 1px solid #333; padding-top: 15px; } 
        #file-input { display: none; } 
        #upload-status { font-size: 12px; color: #aaa; margin-top: 5px; } 
    </style> 
</head> 
<body> 
    <div class="player-card"> 
        <h1>🌌 Cosmic Music Player</h1> 
        <div id="track-title">Connecting to Cloud...</div> 
        <audio id="audio" style="width: 100%; margin-top: 15px;" preload="auto" crossorigin="anonymous"></audio> 
        <div> 
            <button class="btn" onclick="prevTrack()">⏮️ Prev</button> 
            <button class="btn" id="play-pause-btn" onclick="togglePlay()">⏸️ Pause</button> 
            <button class="btn" onclick="nextTrack()">⏭️ Next</button> 
        </div> 
        <div> 
            <button class="btn" id="shuf-btn" onclick="toggleShuffle()">🔀 Shuffle</button> 
            <button class="btn" id="loop-btn" onclick="toggleLoop()">🔁 Loop: OFF</button> 
        </div> 
        <select id="playlist-select" onchange="playTrackByIndex(parseInt(this.value))"></select> 
        <div class="upload-section"> 
            <label for="file-input" class="btn" style="background: #222; color: #00ff66; display: inline-block; border: 2px solid #00ff66;">👥 Shared Group Upload</label> 
            <input type="file" id="file-input" accept="audio/*" multiple onchange="handleCloudUpload(event)"> 
            <div id="upload-status"></div> 
        </div> 
    </div> 

<script>
// IMPORTANT: Put your actual values inside these quotes!
const SUPABASE_URL = "YOUR_ACTUAL_SUPABASE_URL";
const SUPABASE_KEY = "YOUR_ACTUAL_SUPABASE_KEY";

let clientInstance;
let playlist = [];
let index = 0, isShuffle = false, loopMode = 0;
const player = document.getElementById('audio');
const selectBox = document.getElementById('playlist-select');
const playPauseBtn = document.getElementById('play-pause-btn');
const statusDiv = document.getElementById('upload-status');
let wakeLock = null;

function initSupabase() {
    if (window.supabase && window.supabase.createClient) {
        clientInstance = window.supabase.createClient(, SUPABASE_KEY);
        fetchLivePlaylist();
        setupRealtime();
    } else {
        setTimeout(initSupabase, 200);
    }
}

async function fetchLivePlaylist() {
    try {
        const { data, error } = await clientInstance.from('playlist').select('*').order('id', { ascending: true });
        if (error) throw error;
        playlist = data || [];
        updateUI();
        if(playlist.length === 0) document.getElementById('track-title').innerText = "Empty Playlist";
    } catch (err) {
        console.error(err);
        document.getElementById('track-title').innerText = "Database Synchronization Error";
    }
}

function updateUI() {
    const currentVal = selectBox.value;
    selectBox.innerHTML = '';
    playlist.forEach((track, i) => {
        let opt = document.createElement('option');
        opt.value = i;
        opt.innerText = track.title;
        selectBox.appendChild(opt);
    });
    if(playlist.length > 0 && !player.src) {
        loadTrack(0);
    }
    if(currentVal && currentVal < playlist.length) selectBox.value = currentVal;
}

function loadTrack(i) {
    if (!playlist || playlist.length === 0) return;
    index = i;
    selectBox.value = i;
    document.getElementById('track-title').innerText = playlist[index].title;
    player.src = playlist[index].url;
    
    updateMediaSession();
}

async function requestWakeLock() {
    try {
        if ('wakeLock' in navigator && !wakeLock) {
            wakeLock = await navigator.wakeLock.request('screen');
        }
    } catch (err) {
        console.log("WakeLock blocked (requires HTTPS):", err.message);
    }
}

function releaseWakeLock() {
    if (wakeLock) {
        wakeLock.release().then(() => { wakeLock = null; });
    }
}

function updateMediaSession() {
    if ('mediaSession' in navigator && playlist[index]) {
        navigator.mediaSession.metadata = new MediaMetadata({
            title: playlist[index].title,
            artist: "Cosmic Player",
            album: "Supabase Playlist"
        });

        navigator.mediaSession.setActionHandler('play', () => { togglePlay(); });
        navigator.mediaSession.setActionHandler('pause', () => { togglePlay(); });
        navigator.mediaSession.setActionHandler('previoustrack', () => { prevTrack(); });
        navigator.mediaSession.setActionHandler('nexttrack', () => { nextTrack(); });
    }
}

function playTrackByIndex(i) {
    loadTrack(i);
    requestWakeLock();
    player.play().then(() => {
        playPauseBtn.innerText = "\u23F8\uFE0F Pause";
        if ('mediaSession' in navigator) navigator.mediaSession.playbackState = "playing";
    }).catch(e => console.log(e));
}

function togglePlay() {
    if (player.paused) {
        requestWakeLock();
        player.play().then(() => {
            playPauseBtn.innerText = "\u23F8\uFE0F Pause";
            if ('mediaSession' in navigator) navigator.mediaSession.playbackState = "playing";
        }).catch(e => console.log("Playback failed:", e));
    } else {
        releaseWakeLock();
        player.pause();
        playPauseBtn.innerText = "\u25B6\uFE0F Play";
        if ('mediaSession' in navigator) navigator.mediaSession.playbackState = "paused";
    }
}

function nextTrack() {
    if (playlist.length === 0) return;
    if (loopMode === 1) {
        loadTrack(index);
        player.play();
    } else if (isShuffle) {
        playTrackByIndex(Math.floor(Math.random() * playlist.length));
    } else {
        playTrackByIndex((index + 1) % playlist.length);
    }
}

function prevTrack() {
    if (playlist.length > 0) playTrackByIndex((index - 1 + playlist.length) % playlist.length);
}

function toggleShuffle() {
    isShuffle = !isShuffle;
    document.getElementById('shuf-btn').classList.toggle('btn-active', isShuffle);
}

function toggleLoop() {
    loopMode = (loopMode + 1) % 3;
    const btn = document.getElementById('loop-btn');
    if (loopMode === 0) {
        btn.innerText = "🔁 Loop: OFF";
        btn.classList.remove('btn-active');
    }
    if (loopMode === 1) {
        btn.innerText = "🔂 Loop: SONG";
        btn.classList.add('btn-active');
    }
    if (loopMode === 2) {
        btn.innerText = "🔁 Loop: ALL";
        btn.classList.add('btn-active');
    }
}

async function handleCloudUpload(event) {
    const files = event.target.files;
    if (!files || !files.length) return;
    for (let i = 0; i < files.length; i++) {
        const file = files[i];
        const cleanTitle = file.name.replace(/\.[^/.]+$/, "");
        const safeName = file.name.replace(/[^a-zA-Z0-9.]/g, "_");
        const rawFileName = `${Date.now()}_${safeName}`;
        let assignedMime = file.type;
        if (file.name.endsWith('.m4a')) {
            assignedMime = 'audio/mp4';
        }
        statusDiv.innerText = `Uploading: ${cleanTitle}...`;
        try {
            const fileData = await file.arrayBuffer();
            const { data: uploadData, error: uploadError } = await clientInstance.storage
                .from('Songs')
                .upload(rawFileName, fileData, { contentType: assignedMime, upsert: true });
            if (uploadError) throw uploadError;
            const { data: linkData } = clientInstance.storage
                .from('Songs')
                .getPublicUrl(rawFileName);
            await clientInstance.from('playlist').insert([
                { title: cleanTitle, url: linkData.publicUrl }
            ]);
        } catch (err) {
            console.error(err);
            statusDiv.innerText = "Upload failed!";
            return;
        }
    }
    statusDiv.innerText = "✨ Success!";
    await fetchLivePlaylist();
}

function setupRealtime() {
    try {
        clientInstance.channel('schema-db-changes')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'playlist' }, payload => {
                playlist.push(payload.new);
                updateUI();
            }).subscribe();
    } catch(e) {
        console.log(e);
    }
}

if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('Service Worker registered!', reg.scope))
            .catch(err => console.log('Service Worker failed:', err));
    });
}

player.onended = nextTrack;
window.onload = initSupabase;
</script>
</body> 
</html>
